<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokkit</title>
<link rel="stylesheet" href="../../server/priv/static/vendor/phosphor.css">
<link rel="stylesheet" href="../../server/priv/static/css/dokkit.css">
<script>
// Paint the saved look before first render; with none saved, follow the system theme.
(function () {
  var look = null; try { look = JSON.parse(localStorage.getItem("dokkit-look")); } catch (e) {}
  if (!look) { document.documentElement.className = (matchMedia("(prefers-color-scheme: dark)").matches ? "t-dark " : "") + "d-slate a-teal"; return; }
  document.documentElement.className = [look.theme === "dark" ? "t-dark" : "", look.base && look.base !== "neutral" ? "d-" + look.base : "", look.accent && look.accent !== "violet" ? "a-" + look.accent : ""].filter(Boolean).join(" ");
})();
</script>
</head>
<body>
<button class="skip" type="button" onclick="document.getElementById('page').focus()">Skip to content</button>
<div class="shell">
  <nav class="side" id="side" aria-label="Main"></nav>
  <main class="page" id="page" tabindex="-1"></main>
</div>
<script src="data.js"></script>
<script src="more.js"></script>
<script src="app.js"></script>
</body>
</html>
