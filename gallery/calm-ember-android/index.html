<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../calm-ember/shared/phosphor.css">
<link rel="stylesheet" href="shared/base.css">
<style>
  body { overflow: auto; }
  .review { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; max-width: 1180px; margin: 0 auto; padding: 28px 32px; align-items: start; }
  .side { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 28px; }
  .side h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; display: flex; gap: 12px; align-items: center; }
  .side .lede { font-size: 16px; }
  .dirs { display: flex; flex-direction: column; gap: 8px; }
  .dir { all: unset; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
  .dir b { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-2); font-weight: 800; }
  .dir strong { font-size: 15.5px; }
  .dir span { color: var(--muted); font-size: 13.5px; }
  .dir[aria-selected="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--shadow); }
  .dir[aria-selected="true"] b { background: var(--brand); color: var(--brand-ink); }
  .dir:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .ctls { display: grid; gap: 12px; }
  .ctls label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
  .ctls select { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; }
  .jump { display: flex; flex-wrap: wrap; gap: 6px; }
  .jump button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font-size: 13.5px; font-weight: 600; }
  .jump button:focus-visible { outline: 3px solid var(--focus); }
  .note { font-size: 13px; color: var(--muted); margin: 0; }
  .device { width: 412px; height: 892px; border-radius: 46px; padding: 12px; background: #120d0b; box-shadow: 0 30px 60px rgba(36, 26, 21, .25), inset 0 0 0 2px #3a2f2a; position: sticky; top: 20px; }
  .device iframe { width: 100%; height: 100%; border: 0; border-radius: 36px; background: var(--bg); display: block; }
  @media (max-width: 860px) {
    .review { grid-template-columns: minmax(0, 1fr); padding: 0; gap: 0; }
    .side { position: static; padding: 14px 16px; gap: 12px; }
    .side h1 { font-size: 21px; } .side .lede, .note { display: none; }
    .dirs { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
    .dir { grid-template-columns: 28px auto; padding: 8px 12px; white-space: nowrap; }
    .dir b { width: 28px; height: 28px; } .dir span { display: none; }
    .ctls { grid-template-columns: 1fr 1fr; } .jump { grid-column: 1 / -1; flex-wrap: nowrap; overflow-x: auto; }
    .device { width: 100%; height: calc(100dvh - 210px); min-height: 560px; border-radius: 0; padding: 0; box-shadow: none; position: static; }
    .device iframe { border-radius: 0; }
  }
</style>
</head>
<body>
<div class="review">
  <div class="side">
    <h1><span id="logo"></span> Dokkit for Android</h1>
    <p class="lede">Five directions grown from C, all on the same made-up estate. Every screen the app has today is in each one; tap around and scroll.</p>
    <div class="dirs" role="tablist" aria-label="Directions" id="dirs"></div>
    <div class="ctls">
      <label>What the phone is going through
        <select id="scenario">
          <option value="normal">Things need you</option>
          <option value="fine">Everything is fine</option>
          <option value="stale">The snapshot is late</option>
          <option value="error">The relay cannot be reached</option>
          <option value="nosnap">Paired, no snapshot yet</option>
          <option value="leftout">Logs and charts left out</option>
          <option value="one">Only one server paired</option>
          <option value="none">No server paired yet</option>
          <option value="locked">Locked</option>
          <option value="nolock">Locked, no screen lock set</option>
          <option value="stayed">Locked, unlock was cancelled</option>
          <option value="camoff">Adding a server, camera off</option>
          <option value="pairerr">Adding a server, bad code</option>
        </select>
      </label>
      <label>Look
        <select id="theme">
          <option value="">Follow this computer</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <div class="jump" id="jump" aria-label="Go to a screen"></div>
    </div>
    <p class="note">The heat maps use made-up data: the phone snapshot does not carry a machine's last day yet, so building them needs the server to send it.</p>
  </div>
  <div class="device"><iframe id="frame" title="Phone"></iframe></div>
</div>
<script>
  var DIRS = [
    ["c", "C, the start", "The hero you picked, as it was."],
    ["f", "Flow", "One gradient runs the whole page; the hero folds into the top bar as you scroll."],
    ["g", "Wallet", "The state reads like a balance; issues are a deck of big cards that fans out."],
    ["h", "Depth", "Soft layers drift at different speeds; glass cards; sheets fly out of what you tap."],
    ["i", "Ribbon", "Sections rise in as they arrive; a floating tab bar; the warm light follows you down."],
    ["j", "Statement", "Big type, one pinned hero card that settles small; a card opens into its page."]
  ];
  var JUMP = [["Home", "#home"], ["A service", "#service/s-upload"], ["A job", "#service/s-purge"], ["A machine", "#machine/nas"], ["Servers", "#servers"], ["Settings", "#settings"], ["Add a server", "#add"], ["Lock", "#lock"], ["First run", "#first"]];
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var cur = store.get("android-dir2") || "f", frame = document.getElementById("frame");
  var scen = document.getElementById("scenario"), theme = document.getElementById("theme");
  scen.value = store.get("android-scen") || "normal"; theme.value = store.get("android-theme") || "";
  if (theme.value) document.documentElement.dataset.theme = theme.value;

  function load(route) {
    var src = cur + ".html?s=" + scen.value + (theme.value ? "&theme=" + theme.value : "") + (route || "");
    frame.src = src;
  }
  function draw() {
    document.getElementById("dirs").innerHTML = DIRS.map(function (d) {
      return '<button class="dir" role="tab" type="button" data-dir="' + d[0] + '" aria-selected="' + (d[0] === cur) + '"><b>' + d[0].toUpperCase() + "</b><strong>" + d[1] + "</strong><span>" + d[2] + "</span></button>";
    }).join("");
  }
  document.getElementById("dirs").onclick = function (e) {
    var b = e.target.closest("[data-dir]"); if (!b) return;
    cur = b.dataset.dir; store.set("android-dir2", cur); draw(); load();
  };
  document.getElementById("jump").innerHTML = JUMP.map(function (j) { return '<button type="button" data-route="' + j[1] + '">' + j[0] + "</button>"; }).join("");
  document.getElementById("jump").onclick = function (e) { var b = e.target.closest("[data-route]"); if (b) load(b.dataset.route); };
  scen.onchange = function () { store.set("android-scen", scen.value); load(); };
  theme.onchange = function () {
    store.set("android-theme", theme.value);
    if (theme.value) document.documentElement.dataset.theme = theme.value; else delete document.documentElement.dataset.theme;
    load();
  };
  document.getElementById("logo").innerHTML = '<span style="width:36px;height:36px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center"><svg viewBox="0 0 100 100" width="30" height="30" fill="currentColor" aria-hidden="true"><circle cx="27.5" cy="30.5" r="5.4"></circle><path d="M39 25H53A23 23 0 0 1 53 71H28A4 4 0 0 1 24 67V43A4 4 0 0 1 28 39H33A4 4 0 0 1 37 43V60H53A12 12 0 0 0 53 36H39A3.5 3.5 0 0 1 35.5 32.5V28.5A3.5 3.5 0 0 1 39 25Z"></path></svg></span>';
  draw(); load();
</script>
</body>
</html>
