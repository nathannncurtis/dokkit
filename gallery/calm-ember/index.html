<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokkit Calm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="shared/phosphor.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <a href="#inbox" class="brand-link">
        <span class="mark"><svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><circle cx="27.5" cy="30.5" r="5.4"></circle><path d="M39 25H53A23 23 0 0 1 53 71H28A4 4 0 0 1 24 67V43A4 4 0 0 1 28 39H33A4 4 0 0 1 37 43V60H53A12 12 0 0 0 53 36H39A3.5 3.5 0 0 1 35.5 32.5V28.5A3.5 3.5 0 0 1 39 25Z"></path></svg></span>
        Dokkit
      </a>
      <button class="theme" id="theme" type="button" aria-label="Switch to dark mode"><i class="ph ph-moon-stars" aria-hidden="true"></i></button>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#inbox" data-r="inbox"><i class="ph ph-tray" aria-hidden="true"></i><span>Inbox</span><b class="count" id="nav-count"></b></a>
      <a href="#everything" data-r="everything"><i class="ph ph-squares-four" aria-hidden="true"></i><span>Everything</span></a>
      <a href="#jobs" data-r="jobs"><i class="ph ph-clock" aria-hidden="true"></i><span>Jobs</span></a>
      <a href="#logs" data-r="logs"><i class="ph ph-scroll" aria-hidden="true"></i><span>Logs</span></a>
      <a href="#settings" data-r="settings"><i class="ph ph-gear" aria-hidden="true"></i><span>Settings</span></a>
    </nav>
    <div class="side-machines">
      <h2 class="side-h">Machines</h2>
      <ul id="side-machines"></ul>
    </div>
  </aside>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="shared/data.js"></script>
<script src="app.js"></script>
</body>
</html>
