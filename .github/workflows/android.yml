name: android

on:
  workflow_dispatch:

# Run by hand. A step that fails is reported in the last step and does not fail the run.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        continue-on-error: true
        with:
          gradle-version: '9.6.0'
      - name: Build the unsigned app
        id: app
        continue-on-error: true
        working-directory: apps/android
        run: ./build-unsigned.sh
      - uses: actions/upload-artifact@v7
        if: steps.app.outcome == 'success'
        with:
          name: phone-android
          path: apps/android/out/*
      - name: Result
        run: echo "app=${{ steps.app.outcome }}"
