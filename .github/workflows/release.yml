name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A build that fails does not fail the run. The release job publishes only when every file is there.
jobs:
  image:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/nathannncurtis/dokkit-server
          # Each repository publishes its own image; only the public one uses this name.
          [ "$GITHUB_REPOSITORY" = nathannncurtis/dokkit ] || image=ghcr.io/$GITHUB_REPOSITORY_OWNER/dokkit
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "list=${image}:${GITHUB_REF_NAME#v},${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "list=${image}:test" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        id: build
        with:
          context: server
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.tags.outputs.list }}
      - name: Sign the image
        if: github.ref_type == 'tag'
        run: |
          image=$(echo "${{ steps.tags.outputs.list }}" | cut -d, -f1 | cut -d: -f1)
          cosign sign --yes "${image}@${{ steps.build.outputs.digest }}"

  program:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { os: windows, arch: amd64, ext: .exe }
          - { os: windows, arch: arm64, ext: .exe }
          - { os: linux, arch: amd64, ext: '' }
          - { os: linux, arch: arm64, ext: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: program/go.mod
      - name: Build
        working-directory: program
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p ../out
          name=dokkit-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          version=v0.0.0-dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; fi
          go build -trimpath -ldflags "-X main.version=$version" -o "../out/$name" .
          cd ../out
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: program-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*

  sign-windows:
    needs: program
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: program-windows-${{ matrix.arch }}
          path: out
      - name: No signing secrets
        if: env.AZURE_CLIENT_SECRET == ''
        shell: bash
        run: echo "::warning::No Azure signing secrets are set, so dokkit-windows-${{ matrix.arch }}.exe is not signed."
      - name: Sign
        if: env.AZURE_CLIENT_SECRET != ''
        uses: Azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus2.codesigning.azure.net/
          trusted-signing-account-name: nathancurtis-signing
          certificate-profile-name: nathancurtis-signing
          files: ${{ github.workspace }}\out\dokkit-windows-${{ matrix.arch }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Checksum
        if: env.AZURE_CLIENT_SECRET != ''
        shell: bash
        run: |
          cd out
          sha256sum "dokkit-windows-${{ matrix.arch }}.exe" > "dokkit-windows-${{ matrix.arch }}.exe.sha256"
      - uses: actions/upload-artifact@v7
        if: env.AZURE_CLIENT_SECRET != ''
        with:
          name: program-windows-${{ matrix.arch }}
          path: out/*
          overwrite: true

  mac:
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: program/go.mod
      - name: Build
        working-directory: program
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p ../out
          version=v0.0.0-dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; fi
          go build -trimpath -ldflags "-X main.version=$version" -o "../out/dokkit-darwin-${{ matrix.arch }}" .
      # macOS keeps an unsigned program off the local network. Without the secrets the file goes out unsigned.
      - name: Sign
        env:
          APPLE_CERT_P12: ${{ secrets.MAC_DEVID_P12 || secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.MAC_DEVID_P12 && secrets.MAC_DEVID_P12_PASSWORD || secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.MAC_DEVID_IDENTITY || secrets.APPLE_SIGN_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          file=out/dokkit-darwin-${{ matrix.arch }}
          if [ -z "$APPLE_CERT_P12" ] || [ -z "$APPLE_SIGN_IDENTITY" ]; then
            echo "::warning::No signing certificate is set, so $file is not signed."
            exit 0
          fi
          keychain=$RUNNER_TEMP/sign.keychain-db
          pass=$(openssl rand -hex 16)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # The certificate chains to Apple's developer authority, which a fresh keychain may not hold.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer" && security import "$RUNNER_TEMP/wwdr.cer" -k "$keychain" || true
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/devid.cer" && security import "$RUNNER_TEMP/devid.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --options runtime --timestamp --identifier dev.dokkit.dokkit --sign "$APPLE_SIGN_IDENTITY" --keychain "$keychain" "$file"
          codesign --verify --strict --verbose=2 "$file"
          codesign -dv --verbose=2 "$file" 2>&1 | grep -E 'Identifier|TeamIdentifier|Authority=Developer ID'
          security delete-keychain "$keychain"
          # A bare program cannot be stapled; Gatekeeper finds the notarization online.
          case "$APPLE_SIGN_IDENTITY" in "Developer ID"*) ;; *) exit 0 ;; esac
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::No App Store Connect key is set, so $file is signed but not notarized."
            exit 0
          fi
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          ditto -c -k "$file" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          rm "$RUNNER_TEMP/asc.p8"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
          echo "Notarization: $status"
          [ "$status" = Accepted ]
      - name: Checksum
        run: |
          cd out
          shasum -a 256 "dokkit-darwin-${{ matrix.arch }}" > "dokkit-darwin-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: program-darwin-${{ matrix.arch }}
          path: out/*

  windows-server:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      MIX_ENV: prod
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'
      - name: Build
        shell: pwsh
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix assets.setup
          mix compile
          mix assets.deploy
          mix release
      - name: Check the release holds what the installer needs
        shell: pwsh
        run: |
          foreach ($f in 'bin\dokkit.bat', 'install.ps1') {
            if (-not (Test-Path "_build\prod\rel\dokkit\$f")) { throw "$f is not in the release" }
          }
      - name: No signing secrets
        if: env.AZURE_CLIENT_SECRET == ''
        shell: bash
        run: echo "::warning::No Azure signing secrets are set, so the server programs are not signed."
      - name: Sign
        if: env.AZURE_CLIENT_SECRET != ''
        uses: Azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus2.codesigning.azure.net/
          trusted-signing-account-name: nathancurtis-signing
          certificate-profile-name: nathancurtis-signing
          files-folder: ${{ github.workspace }}\server\_build\prod\rel\dokkit
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Zip
        shell: bash
        run: |
          mkdir -p ../out
          pwsh -Command "Compress-Archive -Path '_build/prod/rel/dokkit/*' -DestinationPath '../out/dokkit-windows-x64.zip'"
          cd ../out
          sha256sum dokkit-windows-x64.zip > dokkit-windows-x64.zip.sha256
      - name: Upgrade the last release to this one
        shell: pwsh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo $env:GITHUB_REPOSITORY --pattern dokkit-windows-x64.zip --dir "$env:RUNNER_TEMP/last"
          ./.github/scripts/windows-upgrade.ps1 -Old "$env:RUNNER_TEMP/last/dokkit-windows-x64.zip" -New out/dokkit-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-server
          path: out/*

  ios:
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version && swift --version
      - name: Build the unsigned app
        working-directory: apps/ios
        run: ./build-unsigned.sh
      - uses: actions/upload-artifact@v7
        with:
          name: phone-ios
          path: apps/ios/out/*

  testflight:
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
      IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the secrets
        id: gate
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$IOS_DIST_P12" ]; then
            echo "::warning::The App Store Connect secrets are not set, so nothing is uploaded to TestFlight."
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the signing files
        if: steps.gate.outputs.go != 'no'
        run: |
          keychain=$RUNNER_TEMP/ios.keychain-db
          pass=$(openssl rand -hex 16)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/dist.p12"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer" && security import "$RUNNER_TEMP/wwdr.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$IOS_PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/6f5092c3-5b2e-4a67-88c3-b7fa87728baa.mobileprovision"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive and export
        if: steps.gate.outputs.go != 'no'
        working-directory: apps/ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          version=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          version=${version#v}
          [ -n "$version" ] || version=0.1.0
          build=$(date -u +%y%m%d).$(date -u +%H%M%S)
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "Uploading $version ($build)"
          # The profile goes to the app target only (through Signing.xcconfig); package resource bundles cannot take one.
          echo 'PROVISIONING_PROFILE_SPECIFIER = Dokkit App Store' > Local.xcconfig
          xcodegen generate
          xcodebuild archive -project Dokkit.xcodeproj -scheme Dokkit -configuration Release -destination generic/platform=iOS -archivePath build/Dokkit.xcarchive DEVELOPMENT_TEAM=Z46423B3U9 CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build"
          xcodebuild -exportArchive -archivePath build/Dokkit.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export
      - name: Upload to TestFlight
        if: steps.gate.outputs.go != 'no'
        run: xcrun altool --upload-app -t ios -f apps/ios/build/export/Dokkit.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"
      - name: Add to the Public group and submit for beta review
        if: steps.gate.outputs.go != 'no' && github.ref_type == 'tag'
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography requests
          "$RUNNER_TEMP/venv/bin/python" apps/ios/testflight.py "$BUILD_NUMBER"
      - name: Remove the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios.keychain-db" || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Build the unsigned app
        working-directory: apps/android
        run: ./build-unsigned.sh
      - name: Sign
        working-directory: apps/android/out
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::warning::No Android signing key is set, so only the unsigned app is attached."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/dokkit.p12"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" sign --ks "$RUNNER_TEMP/dokkit.p12" --ks-type PKCS12 --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --v4-signing-enabled false --out dokkit-android.apk dokkit-android-unsigned.apk
          rm "$RUNNER_TEMP/dokkit.p12"
          "$apksigner" verify --verbose --print-certs dokkit-android.apk
          sha256sum dokkit-android.apk > dokkit-android.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: phone-android
          path: apps/android/out/*

  desktop:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop/src-tauri
    env:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      MAC_P12: ${{ secrets.MAC_DEVID_P12 }}
      MAC_P12_PASSWORD: ${{ secrets.MAC_DEVID_P12_PASSWORD }}
      MAC_IDENTITY: ${{ secrets.MAC_DEVID_IDENTITY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev libdbus-1-dev
      - name: Mac targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-tauri*
            ~/.cargo/bin/trusted-signing-cli*
            apps/desktop/src-tauri/target
          key: desktop-release-${{ matrix.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Tauri CLI
        run: command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked
      - name: No Windows signing secrets
        if: runner.os == 'Windows' && env.AZURE_CLIENT_SECRET == ''
        run: echo "::warning::No Azure signing secrets are set, so the Windows installers are not signed."
      - name: Signing tool
        if: runner.os == 'Windows' && env.AZURE_CLIENT_SECRET != ''
        run: command -v trusted-signing-cli >/dev/null || cargo install trusted-signing-cli --locked
      - name: No Mac signing secrets
        if: runner.os == 'macOS' && (env.MAC_P12 == '' || env.MAC_IDENTITY == '')
        run: echo "::warning::No signing certificate is set, so the Mac app is not signed."
      - name: Mac keychain
        if: runner.os == 'macOS' && env.MAC_P12 != '' && env.MAC_IDENTITY != ''
        run: |
          keychain=$RUNNER_TEMP/sign.keychain-db
          pass=$(openssl rand -hex 16)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MAC_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer" && security import "$RUNNER_TEMP/wwdr.cer" -k "$keychain" || true
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/devid.cer" && security import "$RUNNER_TEMP/devid.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "APPLE_SIGNING_IDENTITY=$MAC_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
            echo "APPLE_API_KEY=$ASC_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
          else
            echo "::warning::No App Store Connect key is set, so the Mac app is signed but not notarized."
          fi
      - name: Build
        run: |
          args=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            args+=(--config "{\"version\":\"${GITHUB_REF_NAME#v}\"}")
          fi
          if [ "$RUNNER_OS" = Windows ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            args+=(--config '{"bundle":{"windows":{"signCommand":{"cmd":"trusted-signing-cli","args":["-e","https://wus2.codesigning.azure.net/","-a","nathancurtis-signing","-c","nathancurtis-signing","-d","Dokkit","%1"]}}}}')
          fi
          if [ "$RUNNER_OS" = macOS ]; then args+=(--target universal-apple-darwin); fi
          cargo tauri build "${args[@]}"
      - name: Sign and notarize the disk image
        if: runner.os == 'macOS' && env.MAC_P12 != '' && env.MAC_IDENTITY != ''
        run: |
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          codesign --force --timestamp --sign "$MAC_IDENTITY" "$dmg"
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|TeamIdentifier|Authority=Developer ID'
          if [ -n "$ASC_KEY_P8" ]; then
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
            status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
            echo "Notarization: $status"
            [ "$status" = Accepted ]
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            xcrun stapler validate "$app"
          fi
      - name: Stable names
        run: |
          mkdir -p ../../../out
          b=target/release/bundle
          case "$RUNNER_OS" in
            Windows)
              cp $b/nsis/*-setup.exe ../../../out/dokkit-desktop-windows-x64-setup.exe
              cp $b/msi/*.msi ../../../out/dokkit-desktop-windows-x64.msi ;;
            macOS)
              cp target/universal-apple-darwin/release/bundle/dmg/*.dmg ../../../out/dokkit-desktop-macos-universal.dmg ;;
            Linux)
              cp $b/deb/*.deb ../../../out/dokkit-desktop-linux-amd64.deb
              cp $b/rpm/*.rpm ../../../out/dokkit-desktop-linux-x86_64.rpm
              cp $b/appimage/*.AppImage ../../../out/dokkit-desktop-linux-amd64.AppImage ;;
          esac
          cd ../../../out
          for f in dokkit-desktop-*; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    if: always() && github.ref_type == 'tag'
    needs: [image, program, sign-windows, mac, windows-server, ios, android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # Six programs and the Windows server, each with its checksum. The phone and desktop apps are added when they built.
          # Only release files go up; other artifacts (a build record, say) are dropped first.
          find assets -maxdepth 1 -type f ! -name 'dokkit-*' -print -delete
          found=$(ls assets 2>/dev/null | grep -v -e '^dokkit-ios' -e '^dokkit-android' -e '^dokkit-desktop' | wc -l)
          if [ "$found" -ne 14 ]; then
            echo "::warning::Not published: $found of 14 files were built."
            ls assets
            exit 0
          fi
          # The list the updater trusts: every file's SHA-256 under the version, signed with the release key.
          cd assets
          { echo "version $GITHUB_REF_NAME"; sha256sum $(ls | grep -v -e '\.sha256$' -e '^SHA256SUMS' | sort); } > SHA256SUMS
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.pem"
            openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/release.pem" -in SHA256SUMS -out "$RUNNER_TEMP/sums.sig"
            openssl pkey -in "$RUNNER_TEMP/release.pem" -pubout -out "$RUNNER_TEMP/release.pub"
            openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/release.pub" -in SHA256SUMS -sigfile "$RUNNER_TEMP/sums.sig"
            base64 -w0 "$RUNNER_TEMP/sums.sig" > SHA256SUMS.sig
            rm "$RUNNER_TEMP/release.pem"
          else
            echo "::warning::No release signing key is set, so this release cannot be installed by the updater."
          fi
          cd ..
          python3 .github/scripts/release-notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md" || true
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "Dokkit $GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
