name: ios

on:
  workflow_dispatch:

# Run by hand. A step that fails is reported in the last step and does not fail the run.
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Checks
        id: checks
        continue-on-error: true
        working-directory: apps/ios/DokkitKit
        run: set -o pipefail; swift run DokkitChecks 2>&1 | tail -40
      - name: Build the unsigned app
        id: app
        continue-on-error: true
        working-directory: apps/ios
        run: ./build-unsigned.sh
      - uses: actions/upload-artifact@v7
        if: steps.app.outcome == 'success'
        with:
          name: phone-ios
          path: apps/ios/out/*
      - name: Result
        run: echo "checks=${{ steps.checks.outcome }} app=${{ steps.app.outcome }}"
