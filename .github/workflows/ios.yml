name: ios

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checks
        id: checks
        continue-on-error: true
        working-directory: apps/ios/DokkitKit
        run: swift run DokkitChecks 2>&1 | tail -40
      - name: Build the app for the simulator, unsigned
        id: app
        continue-on-error: true
        working-directory: apps/ios
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Dokkit.xcodeproj -scheme Dokkit -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E 'error:|warning: unre|BUILD|\*\*' | sort -u | head -80
      - name: Result
        run: echo "checks=${{ steps.checks.outcome }} app=${{ steps.app.outcome }}"
