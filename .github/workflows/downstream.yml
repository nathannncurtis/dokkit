name: Notify downstream

on:
  push:
    branches: [main]

jobs:
  notify:
    if: github.repository == 'nathannncurtis/dokkit'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_TOKEN }}
          REPO: ${{ secrets.DOWNSTREAM_REPO }}
        run: gh api "repos/$REPO/dispatches" -f event_type=public-push
