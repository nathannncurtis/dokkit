# Version bumps once a month, one grouped PR per ecosystem. Security fixes still come as they appear.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: mix
    directories: [/server, /clients/elixir]
    schedule: { interval: monthly }
    groups: { mix: { patterns: ["*"] } }
  - package-ecosystem: gomod
    directories: [/program, /names, /clients/go, /clients/conformance/programs/go]
    schedule: { interval: monthly }
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /clients/javascript
    schedule: { interval: monthly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: gradle
    directory: /apps/android
    schedule: { interval: monthly }
    groups: { gradle: { patterns: ["*"] } }
  - package-ecosystem: swift
    directories: [/apps/ios/DokkitKit, /clients/swift]
    schedule: { interval: monthly }
    groups: { swift: { patterns: ["*"] } }
  - package-ecosystem: cargo
    directories: [/clients/rust, /clients/conformance/programs/rust, /apps/desktop/src-tauri]
    schedule: { interval: monthly }
    groups: { cargo: { patterns: ["*"] } }
    # windows-core must match the version webview2-com is built against; it moves with webview2-com.
    ignore:
      - dependency-name: windows-core
  - package-ecosystem: pip
    directory: /clients/python
    schedule: { interval: monthly }
    groups: { pip: { patterns: ["*"] } }
  - package-ecosystem: nuget
    directories: [/clients/dotnet/Dokkit, /clients/dotnet/Dokkit.Logging, /clients/dotnet/Test, /clients/conformance/programs/dotnet]
    schedule: { interval: monthly }
    groups: { nuget: { patterns: ["*"] } }
  - package-ecosystem: composer
    directory: /clients/php
    schedule: { interval: monthly }
    groups: { composer: { patterns: ["*"] } }
  - package-ecosystem: maven
    directory: /clients/java
    schedule: { interval: monthly }
    groups: { maven: { patterns: ["*"] } }
