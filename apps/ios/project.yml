name: Dokkit
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  DokkitKit:
    path: DokkitKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Dokkit:
    type: application
    platform: iOS
    sources:
      - Dokkit
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: DokkitKit
        product: DokkitKit
      - package: DokkitKit
        product: DokkitUI
    settings:
      base:
        INFOPLIST_FILE: Dokkit/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          # The demo relay and its snapshots are for looking at debug builds in the simulator; release builds leave them out.
          EXCLUDED_SOURCE_FILE_NAMES: "DemoRelay.swift demo-snapshot.json demo-fine.json"
